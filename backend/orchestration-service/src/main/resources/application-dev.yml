app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:3001
      - http://127.0.0.1:3001

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/orchestration_dev
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orchestration-service
      auto-offset-reset: earliest
    producer:
      acks: all

  redis:
    host: localhost
    port: 6379

logging:
  level:
    com.foodai.orchestration: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: INFO

