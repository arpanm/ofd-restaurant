spring:
  application:
    name: orchestration-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
server:
  port: ${SERVER_PORT:8085}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# API Gateway Configuration
gateway:
  services:
    user-service:
      url: ${USER_SERVICE_URL:http://localhost:8083}
    restaurant-service:
      url: ${RESTAURANT_SERVICE_URL:http://localhost:8081}
    menu-service:
      url: ${MENU_SERVICE_URL:http://localhost:8082}
    order-service:
      url: ${ORDER_SERVICE_URL:http://localhost:8084}
    promotion-service:
      url: ${PROMOTION_SERVICE_URL:http://localhost:8089}
  timeout:
    connect: 5000
    read: 30000
    write: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# CORS (gateway): overridden per profile in application-{profile}.yml
app:
  cors:
    allowed-origins: []
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: "*"
    allow-credentials: true
    max-age: 3600

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.foodai.orchestration: DEBUG
    com.foodai.orchestration.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
