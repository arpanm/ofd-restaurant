spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/orchestration_test
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orchestration-service-test
      auto-offset-reset: earliest
    producer:
      acks: all

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging:
  level:
    root: WARN
    com.foodai.orchestration: DEBUG

