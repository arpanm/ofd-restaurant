# Development profile configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db_dev
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      host: localhost
      port: 27017
      database: order_service_dev
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    com.foodai.order: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.hibernate.SQL: DEBUG

