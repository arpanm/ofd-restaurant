spring:
  application:
    name: promotion-service-test

  data:
    mongodb:
      uri: mongodb://localhost:27017/promotion_test_db
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: promotion-service-test
      auto-offset-reset: earliest
    producer:
      acks: all

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: 0

logging:
  level:
    root: WARN
    com.foodai.promotion: DEBUG
    org.springframework.data.mongodb: WARN

