spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/foodai_restaurant_dev}
      auto-index-creation: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          restaurantEvent:com.foodai.restaurant.event.RestaurantEvent,
          outletEvent:com.foodai.restaurant.event.OutletEvent
    consumer:
      group-id: restaurant-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'

logging:
  level:
    com.foodai.restaurant: DEBUG
    org.springframework.data.mongodb.core: DEBUG
    org.springframework.kafka: INFO

# Cache TTL (in seconds)
cache:
  ttl:
    restaurant: 3600
    outlet: 1800
    contract: 7200


