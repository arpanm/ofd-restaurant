spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true

server:
  port: ${SERVER_PORT:8083}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true

# Auth: JWT and OTP (override JWT_SECRET in production)
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-at-least-256-bits-long-for-hs256}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:3600}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:604800}
  otp:
    expiry-seconds: ${OTP_EXPIRY:600}
    length: 6

