# Production override: use prod profile so application-prod.yml is loaded.
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Set CORS_ALLOWED_ORIGINS (and other secrets) via env or .env.

services:
  user-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod

  restaurant-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod

  menu-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod

  order-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod

  promotion-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod

  orchestration-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
